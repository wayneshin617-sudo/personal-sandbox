name: Collect posts

# GitHub 예약은 워크플로당 5분이 최소이고, 늦거나 아예 빠지기도 한다.
# 한 작업이 1분마다 직접 읽고, 끝나기 전에 다음 작업을 걸어 둔다.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/collect.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: solo-collect-v6
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect every minute
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_TERMINAL_PROMPT=0

          queue_next() {
            pending=$(gh run list --workflow collect.yml --status queued --limit 5 --json databaseId --jq 'length' 2>/dev/null || echo 0)
            case "$pending" in
              ''|*[!0-9]*) pending=0 ;;
            esac
            if [ "$pending" -gt 0 ]; then
              echo "다음 수집이 이미 대기 중"
              return 0
            fi
            attempt=1
            while [ "$attempt" -le 5 ]; do
              if gh workflow run collect.yml --ref main; then
                return 0
              fi
              sleep $((attempt * 2))
              attempt=$((attempt + 1))
            done
            echo "다음 수집 요청 실패"
            return 1
          }

          # 작업 제한(110분)보다 짧게 끝내고, 끝나기 3분 전에 다음 작업을 건다.
          deadline=$((SECONDS + 90 * 60))
          handoff=$((SECONDS + 87 * 60))
          handed=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            start=$SECONDS
            if timeout -k 10 40 git fetch --depth=1 origin main && timeout -k 10 20 git checkout -B main origin/main; then
              timeout -k 20 240 python -m app.collect || echo "수집 실패 또는 시간 초과, 다음 분에 다시 시도"
              git add docs/data/posts.json docs/data/live.json docs/data/meta.json
              if ! git diff --cached --quiet; then
                git commit -m "새 글 반영"
                pushed=0
                for attempt in 1 2 3 4 5; do
                  git rebase --abort >/dev/null 2>&1 || true
                  if timeout -k 10 40 git pull --rebase --autostash origin main && timeout -k 10 30 git push origin HEAD:main; then
                    pushed=1
                    break
                  fi
                  sleep $((attempt * 2))
                done
                if [ "$pushed" -eq 1 ]; then
                  gh workflow run "Publish website" --ref main || echo "사이트 배포 요청 실패"
                else
                  echo "푸시 실패"
                fi
              else
                echo "새 글 없음"
              fi
            else
              echo "git fetch/checkout 시간 초과, 다음 분에 다시 시도"
            fi
            if [ "$handed" -eq 0 ] && [ "$SECONDS" -ge "$handoff" ]; then
              queue_next && handed=1 || true
            fi
            elapsed=$((SECONDS - start))
            if [ "$elapsed" -lt 60 ]; then
              sleep $((60 - elapsed))
            fi
          done
          if [ "$handed" -eq 0 ]; then
            queue_next || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_GEN: v6
          COLLECT_DEADLINE: "200"
      - name: Queue the next collect
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          pending=$(gh run list --workflow collect.yml --status queued --limit 5 --json databaseId --jq 'length' 2>/dev/null || echo 0)
          case "$pending" in
            ''|*[!0-9]*) pending=0 ;;
          esac
          if [ "$pending" -gt 0 ]; then
            echo "다음 수집이 이미 대기 중"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run collect.yml --ref main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "다음 수집 요청 실패"
          exit 1
