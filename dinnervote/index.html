<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>회식 장소 고르기 · 경기 광주</title>
<meta name="description" content="경기 광주 회식 후보를 네이버 지도와 사진으로 비교하고 고르는 페이지">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2303c75a'/%3E%3Cpath d='M16 6a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.6a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --green:#03c75a;--green-d:#02a54b;--green-l:#e8f9ef;
  --ink:#1e1e23;--ink2:#505058;--ink3:#8a8a93;--line:#e6e8eb;--bg:#f5f6f8;
  --star:#ff6b3d;--warn:#fff4e5;--warn-ink:#9a5b00;--err:#fdecec;--err-ink:#b42318;
  --radius:14px;--shadow:0 6px 24px rgba(20,24,31,.12);
  font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
img{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 상단 */
.top{height:60px;display:flex;align-items:center;gap:12px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--green);display:grid;place-items:center;flex:none}
.brand h1{margin:0;font-size:18px;letter-spacing:-.3px;white-space:nowrap}
.brand span{color:var(--ink3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1}
.pick-btn{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:#fff;font-weight:600}
.pick-btn b{color:var(--green-d)}
.pick-btn:hover{border-color:var(--green)}

/* 본문 */
.app{display:flex;height:calc(100% - 60px);position:relative}
.list{width:380px;flex:none;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);z-index:3}
.detail{width:420px;flex:none;background:#fff;border-right:1px solid var(--line);overflow-y:auto;z-index:2;display:none;position:relative}
.app.has-detail .detail{display:block}
.mapwrap{flex:1;position:relative;min-width:0;isolation:isolate}
#map{width:100%;height:100%;background:#e9ecef}

/* 검색 · 필터 */
.tools{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;height:44px;border:2px solid var(--green);border-radius:10px;padding:0 12px}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:15px;min-width:0;background:transparent}
.search button{border:0;background:none;color:var(--ink3);font-size:18px;line-height:1;padding:4px;display:none}
.search.filled button{display:block}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.sortbar{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 0;color:var(--ink3);font-size:12.5px}
.sortbar select{border:0;background:none;font:inherit;color:var(--ink2);font-weight:600;cursor:pointer}
.cards{flex:1;overflow-y:auto}
.empty{padding:40px 20px;text-align:center;color:var(--ink3)}

/* 후보 카드 */
.card{padding:16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;outline:none}
.card:hover,.card:focus-visible{background:#fafbfc}
.card.on{background:var(--green-l)}
.card .row1{display:flex;align-items:baseline;gap:6px;padding-right:44px}
.card .num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;transform:translateY(-1px)}
.card.on .num{background:var(--green)}
.card h3{margin:0;font-size:16.5px;letter-spacing:-.3px;color:#0d47a1}
.card .cat{color:var(--ink3);font-size:13px;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;font-size:13px;color:var(--ink2)}
.star{color:var(--star);font-weight:700}
.star::before{content:"★ "}
.dot::before{content:"·";margin-right:10px;color:#c5c8ce}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{font-size:12px;padding:2px 7px;border-radius:5px;background:#f1f3f5;color:var(--ink2)}
.tag.g{background:var(--green-l);color:var(--green-d);font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:10px;border-radius:10px;overflow:hidden}
.thumbs .ph{aspect-ratio:1/1}
.heart{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.heart svg{width:20px;height:20px;fill:none;stroke:var(--ink3);stroke-width:2}
.heart[aria-pressed=true]{border-color:var(--green);background:var(--green)}
.heart[aria-pressed=true] svg{stroke:#fff}

/* 사진 공통 */
.ph{position:relative;background:#eef0f3;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .25s}
.ph.fail{display:grid;place-items:center;text-align:center;font-size:11.5px;color:var(--err-ink);background:var(--err);padding:6px}
button.ph{border:0;padding:0}
button.ph:hover img{transform:scale(1.04)}

/* 상세 */
.d-close{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;height:0}
.d-close button{margin:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:1}
.hero{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;height:250px}
.hero .ph:first-child{grid-row:span 2}
.hero .more{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center}
.d-body{padding:18px 20px 28px}
.d-head small{color:var(--ink3)}
.d-head h2{margin:2px 0 4px;font-size:22px;letter-spacing:-.5px}
.d-head .meta{font-size:14px}
.rating-src{margin-top:6px;font-size:12px;color:var(--ink3)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 4px}
.btn{height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:#fff;text-decoration:none;font-weight:600;font-size:14px}
.btn:hover{border-color:#c9ccd1}
.btn.primary{grid-column:1/-1;background:var(--green);border-color:var(--green);color:#fff;font-size:15px}
.btn.primary:hover{background:var(--green-d)}
.btn.primary.done{background:#fff;color:var(--green-d);border-color:var(--green)}
.sec{border-top:8px solid var(--bg);margin:18px -20px 0;padding:18px 20px 0}
.sec h4{margin:0 0 10px;font-size:15.5px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:8px 10px;font-size:13.5px}
.kv dt{color:var(--ink3)}
.kv dd{margin:0;color:var(--ink2);white-space:pre-line;word-break:keep-all}
.hours{margin:0;padding:0;list-style:none}
.menu{list-style:none;margin:0;padding:0}
.menu li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.menu li:last-child{border-bottom:0}
.menu .price{flex:none;font-weight:700}
.kw{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kw li{position:relative;padding:7px 10px;border-radius:8px;background:#f6f7f9;font-size:13px;display:flex;justify-content:space-between;overflow:hidden}
.kw li i{position:absolute;inset:0 auto 0 0;background:#e3f6ea;z-index:0}
.kw li span{position:relative}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gallery .ph{aspect-ratio:1/1;border-radius:6px}
.gallery .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:11px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.short{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--warn);color:var(--warn-ink);font-size:12.5px}
.evidence{font-size:13px;color:var(--ink2);margin:0 0 10px}
.links{display:flex;flex-direction:column;gap:6px}
.links a{display:flex;justify-content:space-between;padding:10px 12px;border-radius:8px;border:1px solid var(--line);text-decoration:none;font-size:13px}
.links a:hover{border-color:var(--green)}
.links a span:last-child{color:var(--ink3)}

/* 지도 위 요소 */
.map-tools{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:8px;z-index:1}
.map-tools button{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);font-weight:600;font-size:13px}
.map-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,90%);background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;z-index:2;font-size:13.5px;color:var(--ink2);display:none}
.map-msg.show{display:block}
.map-msg strong{display:block;color:var(--err-ink);font-size:15px;margin-bottom:6px}
.map-msg code{font-size:12px;background:#f3f4f6;padding:1px 5px;border-radius:4px;word-break:break-all}
.pin{position:relative;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none}
.pin .bub{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:18px;background:#fff;border:2px solid var(--green);box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap;font-size:12.5px;font-weight:700;color:var(--ink)}
.pin .n{width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:11px}
.pin .s{color:var(--star);font-weight:700}
.pin .tail{width:10px;height:10px;background:#fff;border-right:2px solid var(--green);border-bottom:2px solid var(--green);transform:translateY(-6px) rotate(45deg)}
.pin .lbl{display:inline}
.zoom-out .pin .lbl{display:none}
.zoom-out .pin .bub{padding:5px}
.pin.on{z-index:10}
.pin.on .bub{background:var(--green);color:#fff;transform:scale(1.08)}
.pin.on .n{background:#fff;color:var(--green-d)}
.pin.on .s{color:#fff}
.pin.on .lbl{display:inline}
.pin.on .bub{padding:5px 10px 5px 5px}
.pin.on .tail{background:var(--green)}
.pin.hover .bub{border-color:var(--ink)}
.cluster{transform:translate(-50%,-50%);min-width:46px;height:46px;padding:0 12px;border-radius:23px;background:var(--ink);color:#fff;border:3px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
.cluster.on{background:var(--green)}

/* 내 선택 */
.drawer{position:fixed;inset:0;z-index:30;display:none}
.drawer.show{display:block}
.drawer .dim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(400px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:17px}
.drawer header button{border:0;background:none;font-size:22px;line-height:1}
.drawer .body{flex:1;overflow-y:auto;padding:16px 18px}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn);color:var(--warn-ink);font-size:13px;margin-bottom:14px}
.picked{list-style:none;padding:0;margin:0 0 16px}
.picked li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.picked .ph{width:52px;height:52px;border-radius:8px;flex:none}
.picked div{flex:1;min-width:0}
.picked b{display:block;font-size:14px}
.picked small{color:var(--ink3)}
.picked button{border:1px solid var(--line);background:#fff;border-radius:8px;height:32px;padding:0 10px;font-size:12.5px}
.drawer .foot{padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:13.5px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 사진 확대 */
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.94);display:none;flex-direction:column;color:#fff}
.lb.show{display:flex}
.lb-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;font-size:14px}
.lb-top button{border:0;background:none;color:#fff;font-size:26px;line-height:1;padding:4px 8px}
.lb-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 64px}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.lb-stage .fail{color:#ffb4ab;text-align:center}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px}
.lb-nav:hover{background:rgba(255,255,255,.26)}
.lb-prev{left:10px}.lb-next{right:10px}
.lb-cap{padding:12px 18px 6px;text-align:center;font-size:13.5px;color:#d7d7db}
.lb-cap a{color:#8fe3b0}
.lb-strip{display:flex;gap:6px;justify-content:center;padding:8px 12px 16px;overflow-x:auto}
.lb-strip button{flex:none;width:54px;height:54px;padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;opacity:.55;background:#333}
.lb-strip button.on{border-color:var(--green);opacity:1}
.lb-strip img{width:100%;height:100%;object-fit:cover}

/* 모바일 */
.mobile-back{display:none}
@media (max-width:1100px){
  .detail{position:absolute;left:380px;top:0;bottom:0;box-shadow:var(--shadow)}
}
@media (max-width:760px){
  .top{height:54px;padding:0 12px}
  .brand span{display:none}
  .brand h1{font-size:16px}
  .app{flex-direction:column;height:calc(100% - 54px)}
  .mapwrap{flex:none;height:38vh;order:-1}
  .list{width:auto;flex:1;min-height:0;border-right:0}
  .detail{position:fixed;inset:0;width:auto;z-index:20;box-shadow:none}
  .hero{height:220px}
  .lb-stage{padding:0 8px}
  .lb-nav{background:rgba(0,0,0,.4)}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.6A2.6 2.6 0 1 1 12 6.4a2.6 2.6 0 0 1 0 5.2z"/></svg></div>
    <h1>회식 장소 고르기</h1>
    <span id="subtitle"></span>
  </div>
  <div class="grow"></div>
  <button class="pick-btn" id="openPicks" type="button">내 선택 <b id="pickCount">0</b></button>
</header>

<div class="app" id="app">
  <section class="list" aria-label="후보 목록">
    <div class="tools">
      <label class="search" id="searchBox">
        <span class="sr">후보 검색</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#03c75a" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="상호, 메뉴, 지역 검색 (예: 곱창, 룸)" autocomplete="off">
        <button type="button" id="clearQ" aria-label="검색어 지우기">×</button>
      </label>
      <div class="chips" id="chips" role="group" aria-label="지역 필터"></div>
      <div class="sortbar">
        <span id="count"></span>
        <label>정렬 <select id="sort">
          <option value="default">기본순</option>
          <option value="score">별점 높은순</option>
          <option value="reviews">리뷰 많은순</option>
        </select></label>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <section class="detail" id="detail" aria-label="식당 상세"></section>

  <section class="mapwrap" aria-label="지도">
    <div id="map"></div>
    <div class="map-tools">
      <button type="button" id="fitAll">전체 보기</button>
    </div>
    <div class="map-msg" id="mapMsg" role="alert"></div>
  </section>
</div>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="dim" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <header><h3 id="drawerTitle">내가 고른 후보</h3><button type="button" data-close aria-label="닫기">×</button></header>
    <div class="body">
      <div class="notice">이 선택은 <b>지금 쓰는 브라우저에만</b> 저장됩니다. 팀 전체 투표 집계는 아직 없습니다. 아래 버튼으로 문구를 복사해 단톡방에 붙여 넣어 주세요.</div>
      <ul class="picked" id="picked"></ul>
    </div>
    <div class="foot">
      <button class="btn primary" type="button" id="copyMine">내 선택 문구 복사</button>
      <button class="btn" type="button" id="copyAll">전체 후보 목록 복사 (단톡 투표 만들기용)</button>
    </div>
  </div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <div class="lb-top"><span id="lbTitle"></span><button type="button" id="lbClose" aria-label="닫기">×</button></div>
  <div class="lb-stage" id="lbStage">
    <button class="lb-nav lb-prev" type="button" id="lbPrev" aria-label="이전 사진">‹</button>
    <img id="lbImg" alt="">
    <button class="lb-nav lb-next" type="button" id="lbNext" aria-label="다음 사진">›</button>
  </div>
  <div class="lb-cap" id="lbCap"></div>
  <div class="lb-strip" id="lbStrip"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>

function haystack(p) {
  return [p.name, p.naverName, p.givenName, p.category, p.area, p.roadAddress, p.jibunAddress, p.group,

}
function visible() {
  const q = state.q.trim().toLowerCase();

  if (state.sort === 'score') list = [...list].sort((a, b) => (b.rating.score || 0) - (a.rating.score || 0));
  if (state.sort === 'reviews') list = [...list].sort((a, b) => (b.rating.visitorReviews || 0) - (a.rating.visitorReviews || 0));

    const offset = seen[siteKey(p)] = (seen[siteKey(p)] ?? -1) + 1;
    const marker = new naver.maps.Marker({
      position: new naver.maps.LatLng(p.lat, p.lng), map: null,
      icon: { content: pinHtml(p, offset), anchor: new naver.maps.Point(0, 0) },
      title: p.name, zIndex: 100 - p.no,
    });
    naver.maps.Event.addListener(marker, 'click', () => select(p.id, { pan: false }));
    markers[p.id] = marker;
  });
  naver.maps.Event.addListener(map, 'zoom_changed', () => $('map').classList.toggle('zoom-out', map.getZoom() < 14));
  naver.maps.Event.addListener(map, 'idle', recluster);
  $('map').classList.toggle('zoom-out', map.getZoom() < 14);
  new ResizeObserver(() => {
    const el = $('map');
    if (el.clientWidth && el.clientHeight) map.setSize(new naver.maps.Size(el.clientWidth, el.clientHeight));
  }).observe($('map'));
  fitAll();
  recluster();
}
const siteKey = p => p.site;
PLACES.forEach(p => {
  const near = PLACES.find(q => q.site && Math.hypot((q.lat - p.lat) * 111000, (q.lng - p.lng) * 88000) < 25);
  p.site = near ? near.site : p.id;
});
function fitTo(list) {
  if (!map || !list.length) return;
  const lats = list.map(p => p.lat), lngs = list.map(p => p.lng);
  if (Math.max(...lats) - Math.min(...lats) < 0.0015 && Math.max(...lngs) - Math.min(...lngs) < 0.0015) {
    map.morph(new naver.maps.LatLng(lats[0], lngs[0]), 17);
    return;
  }
  map.fitBounds(new naver.maps.LatLngBounds(
    new naver.maps.LatLng(Math.min(...lats), Math.min(...lngs)),
    new naver.maps.LatLng(Math.max(...lats), Math.max(...lngs))), { top: 80, right: 90, bottom: 60, left: 60 });
}
function fitAll() {
  fitTo(visible().length ? visible() : PLACES);
}
let clusterMarkers = [];
function recluster() {
  if (!map) return;
  clusterMarkers.forEach(m => m.setMap(null));
  clusterMarkers = [];
  const proj = map.getProjection();
  const labels = map.getZoom() >= 14;
  const sites = {};
  visible().forEach(p => (sites[siteKey(p)] ||= []).push(p));
  const groups = [];
  Object.values(sites).forEach(ps => {
    const pt = proj.fromCoordToOffset(new naver.maps.LatLng(ps[0].lat, ps[0].lng));
    const g = groups.find(g => Math.abs(g.pt.x - pt.x) < (labels ? 150 : 46) && Math.abs(g.pt.y - pt.y) < (labels ? 40 * Math.max(g.n, ps.length) : 46));
    if (g) { g.ps.push(...ps); g.n++; } else groups.push({ pt, ps: [...ps], n: 1 });
  });
  Object.values(markers).forEach(m => m.setMap(null));
  groups.forEach(g => {
    if (g.n === 1) { g.ps.forEach(p => markers[p.id].setMap(map)); return; }
    const lat = g.ps.reduce((a, p) => a + p.lat, 0) / g.ps.length;
    const lng = g.ps.reduce((a, p) => a + p.lng, 0) / g.ps.length;
    const on = g.ps.some(p => p.id === state.selected);
    const cm = new naver.maps.Marker({
      position: new naver.maps.LatLng(lat, lng), map, zIndex: 900,
      title: g.ps.map(p => p.name).join(', '),
      icon: { content: `<div class="cluster${on ? ' on' : ''}" title="눌러서 확대">${g.ps.map(p => p.no).sort((a, b) => a - b).join('·')} <span style="opacity:.75;margin-left:6px">${g.ps.length}곳</span></div>`, anchor: new naver.maps.Point(0, 0) },
    });
    naver.maps.Event.addListener(cm, 'click', () => fitTo(g.ps));
    clusterMarkers.push(cm);
  });
  highlightMarkers();
}
function syncMarkers() {
  recluster();
}
function highlightMarkers() {
  Object.entries(markers).forEach(([id, m]) => {
    m.setZIndex(id === state.selected ? 1000 : 100 - byId(id).no);
    const el = m.getElement && m.getElement();
    const pin = el && el.querySelector('.pin');
    if (pin) pin.classList.toggle('on', id === state.selected);
  });
}
window.navermap_authFailure = function () {
  showMapError('네이버 지도 인증에 실패했습니다',
    `<p>지금 주소 <code>${esc(location.origin)}</code>가 네이버 클라우드 Maps Application(Client ID <code>${NAVER_CLIENT_ID}</code>)의 Web 서비스 URL에 등록되어 있지 않거나, Dynamic Map이 꺼져 있을 때 나오는 오류입니다.</p>`);
};
function loadNaverMaps() {
  const s = document.createElement('script');
  s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + NAVER_CLIENT_ID;
  s.onload = initMap;
  s.onerror = () => showMapError('네이버 지도 스크립트를 받지 못했습니다',
    '<p><code>oapi.map.naver.com</code> 요청이 실패했습니다. 인터넷 연결이나 광고 차단 확장 프로그램이 이 주소를 막고 있는지 확인해 주세요.</p>');
  document.head.appendChild(s);
}

/* 사진 확대 */
function openLightbox(id, idx) {
  state.lb = { id, idx };
  renderLightbox();
  $('lb').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  state.lb = null;
  $('lb').classList.remove('show');
  document.body.style.overflow = '';
}
function stepLightbox(d) {
  if (!state.lb) return;
  const n = byId(state.lb.id).photos.length;
  state.lb.idx = (state.lb.idx + d + n) % n;
  renderLightbox();
}
function renderLightbox() {
  const p = byId(state.lb.id), i = state.lb.idx, ph = p.photos[i];
  $('lbTitle').textContent = `${p.name} · ${i + 1} / ${p.photos.length}`;
  const im = $('lbImg');
  const old = $('lbStage').querySelector('.fail'); if (old) old.remove();
  im.style.display = '';
  const failed = () => {
    im.style.display = 'none';
    $('lbStage').insertAdjacentHTML('beforeend', '<div class="fail">사진을 불러오지 못했습니다.<br>아래 원문 링크에서 확인해 주세요.</div>');
  };
  const proxied = img(ph.url, 'w750');
  const direct = /(^|\.)(ldb-phinf|pup-review-phinf)\.pstatic\.net$/.test(new URL(ph.url).hostname);
  im.onerror = direct ? () => { im.onerror = failed; im.src = proxied; } : failed;
  im.src = direct ? ph.url : proxied;
  im.alt = `${p.name} ${ph.caption || ''}`;
  const who = [ph.kind, ph.author, ph.date].filter(Boolean).join(' · ');
  $('lbCap').innerHTML = `${esc(ph.caption || '')}${ph.caption ? ' — ' : ''}${esc(who)} · <a href="${esc(ph.link)}" target="_blank" rel="noopener">원문 보기 ↗</a>`;
  $('lbStrip').innerHTML = p.photos.map((x, j) => `<button type="button" class="${j === i ? 'on' : ''}" data-lb="${j}" aria-label="사진 ${j + 1}"><img src="${esc(img(x.url, 'f320_320'))}" alt=""></button>`).join('');
  const on = $('lbStrip').querySelector('.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}

/* 내 선택 */
function renderPicks() {
  const list = state.picks.map(byId).filter(Boolean);
  $('picked').innerHTML = list.length ? list.map(p => `
    <li>${p.photos[0] ? `<div class="ph"><img src="${esc(img(p.photos[0].url, 'f320_320'))}" alt="" data-fail></div>` : ''}
      <div><b>${esc(p.name)}</b><small>★${p.rating.score?.toFixed(2) ?? '-'} · ${esc(p.area)} · ${esc(p.category)}</small></div>
      <button type="button" data-pick="${p.id}">빼기</button></li>`).join('')
    : '<li style="border:0;color:var(--ink3)">아직 고른 후보가 없습니다. 목록의 하트나 상세의 "이 곳으로 고르기"를 눌러 주세요.</li>';
}
function openDrawer(show) {
  $('drawer').classList.toggle('show', show);
  $('drawer').setAttribute('aria-hidden', String(!show));
  if (show) renderPicks();
}
const naverLink = p => p.placeUrl;
async function copy(text, done) {
  try { await navigator.clipboard.writeText(text); toast(done); }
  catch {
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    const ok = document.execCommand('copy'); t.remove(); toast(ok ? done : '복사하지 못했습니다');
  }
}
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* 이벤트 */
$('q').addEventListener('input', e => { state.q = e.target.value; $('searchBox').classList.toggle('filled', !!state.q); renderCards(); });
$('clearQ').addEventListener('click', () => { $('q').value = ''; state.q = ''; $('searchBox').classList.remove('filled'); renderCards(); $('q').focus(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; renderCards(); });
$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-area]'); if (!b) return;
  state.area = b.dataset.area; renderChips(); renderCards(); fitAll();
});
document.addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]');
  if (pick) { e.stopPropagation(); togglePick(pick.dataset.pick); return; }
  const ph = e.target.closest('[data-photo]');
  if (ph) { e.stopPropagation(); const [id, i] = ph.dataset.photo.split(':'); openLightbox(id, +i); return; }
  const lbt = e.target.closest('[data-lb]');
  if (lbt) { state.lb.idx = +lbt.dataset.lb; renderLightbox(); return; }
  const card = e.target.closest('.card');
  if (card) { select(card.dataset.id); return; }
  if (e.target.closest('#closeDetail')) { state.selected = null; renderCards(); renderDetail(); highlightMarkers(); return; }
  if (e.target.closest('[data-close]')) openDrawer(false);
});
$('cards').addEventListener('keydown', e => {
  const card = e.target.closest('.card');
  if (card && (e.key === 'Enter' || e.key === ' ') && e.target === card) { e.preventDefault(); select(card.dataset.id); }
});
$('cards').addEventListener('mouseover', e => {
  const card = e.target.closest('.card');
  document.querySelectorAll('.pin.hover').forEach(x => x.classList.remove('hover'));
  if (card) { const pin = document.querySelector(`.pin[data-pin="${card.dataset.id}"]`); if (pin) pin.classList.add('hover'); }
});
$('fitAll').addEventListener('click', fitAll);
$('openPicks').addEventListener('click', () => openDrawer(true));
$('lbClose').addEventListener('click', closeLightbox);
$('lbPrev').addEventListener('click', () => stepLightbox(-1));
$('lbNext').addEventListener('click', () => stepLightbox(1));
$('lb').addEventListener('click', e => { if (e.target === $('lb') || e.target === $('lbStage')) closeLightbox(); });
let touchX = null;
$('lbStage').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
$('lbStage').addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 40) stepLightbox(dx < 0 ? 1 : -1);
});
document.addEventListener('keydown', e => {
  if (state.lb) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') stepLightbox(-1);
    if (e.key === 'ArrowRight') stepLightbox(1);
  } else if (e.key === 'Escape') {
    if ($('drawer').classList.contains('show')) openDrawer(false);
    else if (state.selected) { state.selected = null; renderCards(); renderDetail(); highlightMarkers(); }
  }
});
$('copyMine').addEventListener('click', () => {
  const list = state.picks.map(byId).filter(Boolean);
  if (!list.length) { toast('먼저 후보를 골라 주세요'); return; }
  copy('[회식 장소] 제가 고른 곳\n' + list.map(p => `- ${p.name} (★${p.rating.score?.toFixed(2) ?? '-'}, ${p.area}) ${naverLink(p)}`).join('\n'), '내 선택 문구를 복사했습니다');
});
$('copyAll').addEventListener('click', () => {
  copy('[회식 장소 후보]\n' + PLACES.map(p => `${p.no}. ${p.name} · ${p.category} · ${p.area} · ★${p.rating.score?.toFixed(2) ?? '-'}\n   ${naverLink(p)}`).join('\n') + '\n\n사진·지도로 비교: ' + location.href.split('#')[0], '전체 후보 목록을 복사했습니다');
});

$('subtitle').textContent = `경기 광주 후보 ${PLACES.length}곳 · 네이버 지도`;
$('pickCount').textContent = state.picks.length;
renderChips();
renderCards();
if (matchMedia('(min-width: 761px)').matches && PLACES.length) select(PLACES[0].id, { pan: false });
loadNaverMaps();
</script>
