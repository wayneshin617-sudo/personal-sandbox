<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSC 물류센터 로고</title>
  <style>
    :root { --ink: #000; --paper: #f2f2ef; --muted: #555; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, "Noto Sans", sans-serif; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 64px 32px 88px; }
    .eyebrow { margin: 0 0 12px; font-size: 12px; font-weight: 650; letter-spacing: 0.2em; }
    h1 { margin: 0; font-size: 68px; letter-spacing: -0.05em; line-height: 0.9; }
    .lead { margin: 18px 0 0; max-width: 460px; color: var(--muted); font-size: 18px; }
    .hero { margin-top: 40px; background: #fff; padding: 48px 28px; display: flex; justify-content: center; }
    .hero img { width: min(100%, 820px); height: auto; }
    .row { display: grid; grid-template-columns: 0.7fr 1.3fr; gap: 16px; margin-top: 16px; }
    .card, .dark { background: #fff; min-height: 240px; display: flex; align-items: center; justify-content: center; padding: 28px; }
    .dark { background: #000; }
    .dark img { width: min(100%, 520px); filter: invert(1); }
    .card img { width: min(100%, 280px); }
    .note { margin: 14px 0 0; color: var(--muted); font-size: 14px; }
    .sizes { margin-top: 16px; background: #fff; padding: 28px 32px; display: flex; align-items: flex-end; gap: 32px; }
    .sizes img { height: 92px; }
    .sizes img.m { height: 52px; }
    .sizes img.s { height: 32px; }
    @media (max-width: 800px) {
      .row { grid-template-columns: 1fr; }
      h1 { font-size: 48px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">NIKE · LOGISTICS CENTER</p>
    <h1>CSC</h1>
    <p class="lead">두 C는 열린 컨테이너입니다. 마지막 도크에서 스우시가 나갑니다.</p>
    <div class="hero">
      <img src="csc-lockup.svg" alt="CSC. 컨테이너 형태의 C, S, 그리고 도크에서 나가는 스우시.">
    </div>
    <div class="row">
      <div class="card">
        <img src="csc-mark.svg" alt="도크 하나에서 스우시가 나가는 심볼">
      </div>
      <div class="dark">
        <img src="csc-lockup.svg" alt="검은 바탕의 CSC 로고">
      </div>
    </div>
    <p class="note">왼쪽 벽의 두 줄은 컨테이너 골입니다. 작은 크기에서도 C, S, C로 읽힙니다.</p>
    <div class="sizes">
      <img src="csc-lockup.svg" alt="큰 로고">
      <img class="m" src="csc-lockup.svg" alt="중간 로고">
      <img class="s" src="csc-lockup.svg" alt="작은 로고">
    </div>
  </main>
</body>
</html>
