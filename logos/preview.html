<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSC 물류센터 로고</title>
  <style>
    :root { --ink: #111; --paper: #f3f3f0; --muted: #5e5e5e; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, "Noto Sans", sans-serif;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 64px 36px 80px; }
    .eyebrow {
      margin: 0 0 12px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.2em;
    }
    h1 { margin: 0; font-size: 64px; letter-spacing: -0.045em; line-height: 0.95; }
    .lead { margin: 18px 0 0; max-width: 460px; color: var(--muted); font-size: 17px; }
    .hero {
      margin-top: 36px;
      background: #fff;
      padding: 56px 40px;
      display: flex;
      justify-content: center;
    }
    .hero img { width: min(100%, 760px); height: auto; }
    .row { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 16px; margin-top: 16px; }
    .dark, .light {
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .dark { background: var(--ink); }
    .dark img { width: min(100%, 420px); filter: invert(1); }
    .light { background: #fff; }
    .light img { width: min(100%, 280px); }
    .three { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 16px; margin-top: 16px; }
    .card { background: #fff; padding: 28px; }
    .card h2 { margin: 18px 0 6px; font-size: 16px; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; }
    .card .stage { min-height: 140px; display: flex; align-items: center; justify-content: center; }
    .card img.word { width: min(100%, 420px); }
    .card img.mark { height: 140px; }
    .sizes { margin-top: 16px; background: #fff; padding: 28px 32px; display: flex; align-items: flex-end; gap: 28px; }
    .sizes img { height: 84px; }
    .sizes img.m { height: 48px; }
    .sizes img.s { height: 32px; }
    @media (max-width: 800px) {
      .row, .three { grid-template-columns: 1fr; }
      h1 { font-size: 44px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">NIKE · LOGISTICS CENTER</p>
    <h1>CSC</h1>
    <p class="lead">컨테이너 골판, CSC, 스우시를 한 사인으로 묶었습니다.</p>
    <div class="hero">
      <img src="csc-lockup.svg" alt="CSC 물류센터 로고. 골판 컨테이너, 스우시, CSC.">
    </div>
    <div class="row">
      <div class="dark">
        <img src="csc-lockup.svg" alt="흰 배경에 뒤집은 로고가 아니라, 어두운 사인 위의 로고">
      </div>
      <div class="light">
        <img src="csc-wordmark.svg" alt="스우시와 CSC 워드마크">
      </div>
    </div>
    <div class="three">
      <article class="card">
        <div class="stage"><img class="word" src="csc-wordmark.svg" alt="워드마크"></div>
        <h2>워드마크</h2>
        <p>문서와 벽 사인에 씁니다. 스우시가 이름 위에 있습니다.</p>
      </article>
      <article class="card">
        <div class="stage"><img class="mark" src="csc-mark.svg" alt="컨테이너 심볼"></div>
        <h2>심볼</h2>
        <p>게이트, 앱, 스탬프용입니다. 컨테이너와 스우시만 남깁니다.</p>
      </article>
    </div>
    <div class="sizes">
      <img src="csc-lockup.svg" alt="큰 로고">
      <img class="m" src="csc-lockup.svg" alt="중간 로고">
      <img class="s" src="csc-lockup.svg" alt="작은 로고">
    </div>
  </main>
</body>
</html>
